<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator Pro</title>
  <link rel="stylesheet" href="style.css" />
  <!-- CDN for reliable QRCode library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="5" height="5" x="3" y="3" rx="1"/>
          <rect width="5" height="5" x="16" y="3" rx="1"/>
          <rect width="5" height="5" x="3" y="16" rx="1"/>
          <path d="M21 16h-3a2 2 0 0 0-2 2v3"/>
          <path d="M21 21v.01"/>
          <path d="M12 7v3a2 2 0 0 1-2 2H7"/>
          <path d="M3 12h.01"/>
          <path d="M12 3h.01"/>
          <path d="M12 16v.01"/>
          <path d="M16 12h1"/>
          <path d="M21 12v.01"/>
          <path d="M12 21v-1"/>
        </svg>
        <h1>QR Craft Studio</h1>
      </div>
      <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
        <svg id="moonIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </header>

    <main class="main-grid">
      <!-- Input Controls Column -->
      <section class="card editor-card">
        <div class="form-group">
          <label for="urlInput">Enter Website Link / URL</label>
          <div class="input-wrapper">
            <input type="url" id="urlInput" placeholder="https://example.com" value="https://google.com" />
            <button id="quickHttpsBtn" class="secondary-btn small-btn">+ https://</button>
          </div>
        </div>

        <div class="customization-grid">
          <div class="form-group">
            <label for="fgColor">Foreground Color</label>
            <div class="color-picker-wrap">
              <input type="color" id="fgColor" value="#0f172a" />
              <span id="fgColorVal">#0f172a</span>
            </div>
          </div>

          <div class="form-group">
            <label for="bgColor">Background Color</label>
            <div class="color-picker-wrap">
              <input type="color" id="bgColor" value="#ffffff" />
              <span id="bgColorVal">#ffffff</span>
            </div>
          </div>

          <div class="form-group">
            <label for="correctLevel">Error Correction Level</label>
            <select id="correctLevel">
              <option value="L">Low (7%)</option>
              <option value="M" selected>Medium (15%)</option>
              <option value="Q">Quartile (25%)</option>
              <option value="H">High (30%)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sizeSlider">Size: <span id="sizeValue">256px</span></label>
            <input type="range" id="sizeSlider" min="128" max="512" step="32" value="256" />
          </div>
        </div>
      </section>

      <!-- Live Preview Column -->
      <section class="card preview-card">
        <h2>Live Preview</h2>
        
        <div class="qr-display-area" id="qrContainer">
          <!-- QRCode.js populates canvas/img here -->
        </div>

        <div class="action-buttons">
          <button id="downloadBtn" class="primary-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Download PNG
          </button>
          <button id="copyUrlBtn" class="secondary-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            Copy URL
          </button>
        </div>
        <div id="toastMessage" class="toast hidden">URL copied to clipboard!</div>
      </section>
    </main>

    <!-- History Section -->
    <section class="card history-card">
      <h3>Recent History</h3>
      <div id="historyContainer" class="history-list">
        <p class="empty-history">No recent QR codes generated yet.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
